<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>めざせ名総裁！日銀マネー・ループ RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Kaisei+Decol:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2340;
    --sub:#5b6788;

    --border-blue:#4a90d9;
    --border-blue-deep:#2f6fb0;
    --panel:#ffffff;
    --panel-blue:#eef7ff;
    --panel-cream:#fff8e6;

    --accent-gold:#f4b400;
    --accent-gold-deep:#d99a00;
    --accent-pink:#ff6fa5;
    --accent-green:#3fa772;
    --accent-red:#e0533d;

    --plaza:#fbeecb;
    --plaza-line:#f0dba8;

    --c-extreme-cold:#3f7fc1;
    --c-cool:#63a9ea;
    --c-ok:#3fa772;
    --c-warm:#f2a93b;
    --c-hot:#e0533d;
    --happy:#3fa772;
    --sad:#e0533d;
    --neutral:#9098a8;

    --pixel-font:'DotGothic16', monospace;
    --body-font:'Zen Maru Gothic', sans-serif;
    --display-font:'Kaisei Decol', serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(255,214,110,0.35), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(120,190,255,0.35), transparent 50%),
      linear-gradient(180deg, #fff6db 0%, #eaf6ff 55%, #dff0ff 100%);
    font-family:var(--body-font);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:980px; margin:0 auto; padding:16px 12px 50px; }

  .brandbar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    color:var(--accent-gold-deep); font-family:var(--pixel-font); letter-spacing:0.08em;
    font-size:12px; padding:10px 0 16px;
  }
  .brandbar .line{flex:1;height:1px;background:linear-gradient(90deg, transparent, rgba(217,154,0,0.5), transparent);}

  /* ---------- generic window (bright, pixel-cornered) ---------- */
  .rpgwin{
    background:var(--panel);
    border:3px solid var(--border-blue);
    box-shadow:0 0 0 3px #ffffff, 0 8px 18px rgba(74,144,217,0.2);
    border-radius:10px;
    color:var(--ink);
    position:relative;
  }
  .rpgwin .winhead{
    font-family:var(--pixel-font);
    background:var(--border-blue);
    color:#fff;
    font-size:12.5px;
    letter-spacing:0.05em;
    padding:6px 12px;
    border-radius:7px 7px 0 0;
    display:flex; align-items:center; justify-content:space-between;
  }
  .rpgwin .winbody{ padding:16px 16px 18px; }

  /* ---------- plain card (title / result / gameover) ---------- */
  .card{
    background:var(--panel);
    border-radius:18px;
    box-shadow:0 8px 24px rgba(74,144,217,0.18);
    padding:26px 24px;
    position:relative;
    overflow:hidden;
    border:2px solid #eef2fb;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg, var(--accent-gold), var(--c-ok), var(--accent-pink), var(--border-blue));
    background-size:300% 100%;
  }
  h1.title{
    font-family:var(--display-font); font-size:clamp(26px,5vw,40px);
    color:var(--ink); text-align:center; line-height:1.35; margin:0 0 8px;
  }
  h1.title span{color:var(--accent-pink);}
  .subtitle{ text-align:center; color:var(--sub); font-size:14px; margin-bottom:24px; }
  .lead{
    font-size:14.5px; line-height:1.9; background:var(--panel-cream);
    border:1px dashed rgba(217,154,0,0.35); border-radius:12px;
    padding:16px 18px; margin-bottom:20px;
  }
  .lead b{color:var(--accent-red);}

  .weapon-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  @media (max-width:560px){ .weapon-grid{grid-template-columns:1fr;} }
  .weapon{ background:var(--panel-blue); border:2px solid var(--border-blue); color:var(--ink); border-radius:14px; padding:14px 16px; }
  .weapon .wname{ font-family:var(--pixel-font); font-size:14px; color:var(--border-blue-deep); margin-bottom:6px; }
  .weapon .wdesc{ font-size:12.5px; line-height:1.7; color:var(--sub); }
  .weapon .wforce{
    display:inline-block; margin-top:8px; font-family:var(--pixel-font); font-size:10px;
    background:rgba(244,180,0,0.18); color:var(--accent-gold-deep);
    border:1px solid rgba(244,180,0,0.5); padding:3px 9px; border-radius:999px;
  }
  .warnbox{ background:#fff1ef; border-color:rgba(224,83,61,0.4) !important; }

  .diff-select{ margin-bottom:20px; }
  .diff-label{ font-family:var(--pixel-font); font-size:12px; color:var(--border-blue-deep); margin-bottom:8px; text-align:center; }
  .diff-options{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:600px){ .diff-options{grid-template-columns:1fr;} }
  .diff-btn{
    background:var(--panel-blue); border:2px solid var(--border-blue); border-radius:12px;
    padding:14px 10px; text-align:center; cursor:pointer; font-size:13px; font-weight:700; color:var(--ink);
    transition:all 0.15s ease;
  }
  .diff-btn span{ display:block; font-weight:400; font-size:10.5px; color:var(--sub); margin-top:4px; }
  .diff-btn.selected{ background:#fff3d6; border-color:var(--accent-gold-deep); box-shadow:0 0 0 2px rgba(244,180,0,0.3); }
  .diff-btn:hover{ background:#e2f0ff; }

  .focus-select{ margin-bottom:20px; }
  .focus-lead{ font-size:11.5px; color:var(--sub); text-align:center; margin-bottom:10px; line-height:1.7; }
  .focus-options{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .focus-btn{
    background:var(--panel-blue); border:2px solid var(--border-blue); border-radius:999px;
    padding:8px 16px; font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer;
    transition:all 0.15s ease;
  }
  .focus-btn:hover{ background:#e2f0ff; }
  .focus-btn.selected{ background:#fff3d6; border-color:var(--accent-gold-deep); box-shadow:0 0 0 2px rgba(244,180,0,0.3); }

  .focus-round-block{ margin:14px 0 4px; }
  .focus-round-block .focus-options{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .focus-note-input{
    width:100%; padding:8px 10px; border:2px solid var(--border-blue); border-radius:8px;
    font-family:var(--body-font); font-size:12.5px; color:var(--ink); background:#fff;
  }
  .focus-note-input:focus{ outline:none; border-color:var(--accent-gold-deep); background:var(--panel-cream); }
  .focus-log-list{ display:flex; flex-direction:column; gap:6px; margin:10px 0 14px; }
  .focus-log-row{ background:var(--panel-blue); border-radius:8px; padding:8px 10px; font-size:12px; }
  .focus-log-row b{ display:block; color:var(--border-blue-deep); margin-bottom:2px; font-size:11.5px; }
  .focus-log-note{ display:block; color:var(--sub); line-height:1.5; }
  .focus-log-note.muted{ font-style:italic; opacity:0.6; }

  .info-box-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:10px; margin-bottom:14px; }
  .info-box .winbody{ padding:12px 14px 14px; }
  .info-badge{ font-family:var(--pixel-font); font-size:13px; color:var(--ink); margin-bottom:6px; }
  .info-desc{ font-size:11.5px; color:var(--sub); line-height:1.65; }
  .price-people{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .price-person{ display:flex; align-items:flex-start; gap:7px; font-size:11px; background:var(--panel-blue); border-radius:8px; padding:6px 9px; }
  .price-person .pp-em{ font-size:16px; }
  .price-person b{ display:block; font-size:10.5px; color:var(--ink); margin-bottom:1px; }
  .pp-mood{ display:block; color:var(--sub); line-height:1.5; }
  .pp-mood.happy{ color:var(--happy); } .pp-mood.sad{ color:var(--sad); }

  button.ghost.small{ padding:6px 16px; font-size:12px; }
  .schema-box{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0 16px; }
  @media (max-width:560px){ .schema-box{grid-template-columns:1fr;} }
  .schema-col{
    background:var(--panel-blue); border:2px solid #cfe0f5; border-radius:10px;
    padding:10px 12px; font-size:11.5px; line-height:1.7; color:var(--sub); transition:all 0.2s ease;
  }
  .schema-col.active{ border-color:var(--accent-gold); background:#fff7e0; box-shadow:0 0 0 2px rgba(244,180,0,0.25); }
  .schema-head{ font-family:var(--pixel-font); font-size:12px; margin-bottom:6px; }
  .schema-col:nth-child(1) .schema-head{ color:#a13a26; }
  .schema-col:nth-child(2) .schema-head{ color:#1f6b45; }
  .schema-box ul{ margin:0; padding-left:16px; }
  .schema-box li{ margin-bottom:4px; }
  .schema-box .fx-line{ color:var(--border-blue-deep); font-weight:700; margin-top:6px; }

  .cta-row{ text-align:center; margin-top:6px;}
  button.primary{
    font-family:var(--body-font); font-weight:700; font-size:16px;
    background:linear-gradient(180deg, var(--accent-gold), var(--accent-gold-deep));
    color:#3a2900; border:none; border-radius:999px;
    padding:13px 34px; cursor:pointer;
    box-shadow:0 6px 16px rgba(244,180,0,0.4);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.primary:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(244,180,0,0.5); }
  button.primary:disabled{ opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none; }
  button.ghost{
    font-family:var(--body-font); font-weight:700; background:#fff;
    color:var(--border-blue-deep); border:2px solid var(--border-blue); border-radius:999px;
    padding:10px 26px; cursor:pointer; font-size:14px;
  }

  /* ---------- HUD ---------- */
  .hud{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:#fff; border:2px solid var(--border-blue);
    border-radius:10px; padding:10px 14px; margin-bottom:14px;
    font-family:var(--pixel-font); color:var(--ink); font-size:11px;
  }
  .hud .pips{ display:flex; gap:4px; align-items:center; }
  .hud .pip{ width:11px; height:11px; border-radius:50%; background:#dfe8f5; border:1px solid #bcd0ea; }
  .hud .pip.done{ background:var(--accent-gold); border-color:var(--accent-gold-deep); }
  .hud .pip.now{ background:var(--c-warm); border-color:#fff; box-shadow:0 0 0 2px rgba(244,180,0,0.4); }
  .hud .pip.star{ background:var(--accent-pink); border-color:#fff; }
  .hud .meter-label{ display:flex; align-items:center; gap:6px; }
  .hud .meter-bar{ width:90px; height:9px; background:#eef2fb; border:1px solid #bcd0ea; border-radius:5px; overflow:hidden; }
  .hud .meter-fill{ height:100%; transition:width 0.5s ease, background-color 0.5s ease; }
  .hud .spacer{ flex:1; }
  .hud .temp-mini{ display:flex; align-items:center; gap:6px; }
  .hud .dot{ width:9px; height:9px; border-radius:50%; }
  .hud .streak-badge{
    background:linear-gradient(90deg, var(--accent-pink), var(--accent-gold));
    color:#fff; padding:3px 9px; border-radius:999px; font-size:10px;
    animation:badgePulse 1s ease infinite;
  }
  @keyframes badgePulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }

  /* ---------- BOJ -> Bank hub ---------- */
  .boj-hub-wrap{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch; gap:10px;
    margin-bottom:12px;
  }
  @media (max-width:640px){ .boj-hub-wrap{ grid-template-columns:1fr; } }
  .boj-card, .bank-hub-card{ background:var(--panel); }
  .boj-card .winbody, .bank-hub-card .winbody{ padding:12px 14px 14px; }
  .gauge-wrap{ display:flex; gap:14px; align-items:center; }
  .thermo-outer{ width:24px; height:120px; border-radius:12px; background:#eef2fb; border:3px solid var(--border-blue); position:relative; overflow:hidden; flex-shrink:0; }
  .thermo-fill{ position:absolute; bottom:0; left:0; right:0; border-radius:0 0 9px 9px; transition:height 0.7s cubic-bezier(.4,0,.2,1), background-color 0.7s ease; }
  .thermo-mark{ position:absolute; left:-5px; right:-5px; height:1px; background:rgba(74,144,217,0.35); }
  .gauge-info{ flex:1; }
  .temp-num{ font-family:var(--display-font); font-size:30px; line-height:1; color:var(--ink); }
  .temp-num small{ font-size:14px; font-weight:400; color:var(--sub); }
  .zone-chip{ display:inline-block; margin-top:6px; padding:4px 12px; border-radius:999px; font-size:11.5px; font-weight:700; color:#fff; }
  .zone-text{ margin-top:8px; font-size:11.5px; color:var(--sub); line-height:1.6; }

  .flow-pipe{
    width:34px; align-self:stretch; border-radius:8px; position:relative; overflow:hidden;
    background:#eef2fb; border:2px solid #cfe0f5; min-height:70px;
  }
  @media (max-width:640px){ .flow-pipe{ width:100%; min-height:26px; } }
  .flow-pipe::before{
    content:""; position:absolute; inset:-40%;
    background-size:16px 16px;
    animation:flowScroll 1.1s linear infinite;
  }
  .flow-pipe.flow-buy::before{
    background-image:repeating-linear-gradient(135deg, var(--accent-gold) 0 4px, transparent 4px 12px);
  }
  .flow-pipe.flow-sell::before{
    background-image:repeating-linear-gradient(135deg, var(--accent-red) 0 4px, transparent 4px 12px);
    animation-direction:reverse;
  }
  .flow-pipe.flow-none::before{
    background-image:repeating-linear-gradient(135deg, #c3cfe3 0 4px, transparent 4px 12px);
    animation-duration:3s; opacity:0.6;
  }
  @keyframes flowScroll{ from{ background-position:0 0; } to{ background-position:32px 32px; } }
  .flow-caption{
    position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
    font-size:14px;
  }

  .bank-title{ display:flex; align-items:center; gap:8px; font-family:var(--pixel-font); font-size:12.5px; color:var(--border-blue-deep); margin-bottom:8px; }
  .bank-stat-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .bank-stat-label{ font-size:11.5px; color:var(--sub); }
  .bank-stat-value{ font-family:var(--display-font); font-size:19px; color:var(--ink); }
  .bank-bar{ height:8px; background:#eef2fb; border:1px solid #cfe0f5; border-radius:5px; overflow:hidden; margin:4px 0 8px; }
  .bank-bar-fill{ height:100%; background:linear-gradient(90deg, var(--accent-gold), var(--c-ok)); transition:width 0.6s ease; }
  .bank-status-line{ font-size:11.5px; color:var(--sub); line-height:1.6; background:var(--panel-blue); border-radius:8px; padding:6px 8px; }

  /* ---------- fx layer (money coins / sparkles) ---------- */
  .fx-host{ position:relative; }
  .fx-layer{ position:absolute; inset:0; pointer-events:none; z-index:5; overflow:visible; }
  .fx-coin{
    position:absolute; font-size:19px; margin-left:-9px; margin-top:-9px;
    transform:translate(0,0) scale(1); opacity:1;
    transition:transform 0.9s cubic-bezier(.4,0,.2,1), opacity 0.9s ease;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    z-index:6;
  }
  .fx-spark{
    position:absolute; font-size:16px; margin-left:-8px; margin-top:-8px;
    transform:translate(0,0) scale(1); opacity:1;
    transition:transform 0.8s cubic-bezier(.2,.7,.3,1), opacity 0.8s ease;
    z-index:6;
  }
  .fx-badge{
    position:absolute; transform:translate(-50%,10px); opacity:0;
    font-family:var(--pixel-font); font-size:10.5px; padding:4px 9px; border-radius:6px;
    white-space:nowrap; animation:badgeFloat 1.8s ease forwards; z-index:7;
  }
  .fx-badge.badge-red{ background:#fff1ef; color:#a13a26; border:1px solid var(--accent-red); }
  .fx-badge.badge-green{ background:#eefbf3; color:#1f6b45; border:1px solid var(--accent-green); }
  @keyframes badgeFloat{
    0%{ opacity:0; transform:translate(-50%,10px); }
    15%{ opacity:1; transform:translate(-50%,0); }
    78%{ opacity:1; transform:translate(-50%,-2px); }
    100%{ opacity:0; transform:translate(-50%,-16px); }
  }
  @keyframes pulseGreen{
    0%{ box-shadow:0 0 0 0 rgba(63,167,114,0); }
    30%{ box-shadow:0 0 0 8px rgba(63,167,114,0.35); }
    100%{ box-shadow:0 0 0 0 rgba(63,167,114,0); }
  }
  @keyframes pulseRed{
    0%{ box-shadow:0 0 0 0 rgba(224,83,61,0); }
    30%{ box-shadow:0 0 0 8px rgba(224,83,61,0.35); }
    100%{ box-shadow:0 0 0 0 rgba(224,83,61,0); }
  }
  @keyframes pulseGold{
    0%{ box-shadow:0 0 0 0 rgba(244,180,0,0); }
    30%{ box-shadow:0 0 0 10px rgba(244,180,0,0.4); }
    100%{ box-shadow:0 0 0 0 rgba(244,180,0,0); }
  }
  .pulse-green{ animation:pulseGreen 1.2s ease; }
  .pulse-red{ animation:pulseRed 1.2s ease; }
  .pulse-gold{ animation:pulseGold 1.4s ease; }

  /* ---------- town grid ---------- */
  .town-grid{
    background:
      repeating-linear-gradient(45deg, var(--plaza-line) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(-45deg, var(--plaza-line) 0 2px, transparent 2px 26px),
      var(--plaza);
    border:3px solid var(--accent-gold-deep);
    border-radius:10px; padding:14px;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:10px;
    margin-bottom:14px;
  }
  @media (max-width:560px){ .town-grid{ grid-template-columns:repeat(2,1fr); } }

  .npc-tile{
    background:var(--panel); border:2px solid #ecd9a8; border-radius:10px;
    padding:8px; display:flex; flex-direction:column; align-items:center; text-align:center;
    position:relative; min-height:118px; justify-content:flex-end;
  }
  .npc-roof{ width:58px; height:22px; margin-bottom:-3px; clip-path:polygon(50% 0%, 3% 100%, 97% 100%); box-shadow:0 2px 2px rgba(0,0,0,0.1); }
  .npc-body{
    width:62px; height:36px; border-radius:5px; display:flex; align-items:center; justify-content:center;
    font-size:24px; position:relative; box-shadow:inset 0 -3px 0 rgba(0,0,0,0.06), 0 2px 3px rgba(0,0,0,0.1);
    background-image:
      radial-gradient(circle at 26% 30%, rgba(255,255,255,0.7) 2.4px, transparent 2.9px),
      radial-gradient(circle at 74% 30%, rgba(255,255,255,0.7) 2.4px, transparent 2.9px);
  }
  .npc-body::after{
    content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:11px; height:12px; background:rgba(0,0,0,0.14); border-radius:2px 2px 0 0;
  }
  .npc-name{
    font-size:10px; font-weight:700; color:#fff; margin-top:7px; line-height:1.3;
    background:var(--border-blue-deep); padding:2px 9px; border-radius:999px;
  }
  .npc-name span{ font-weight:400; color:#dcebfa; }
  .npc-bubble{
    margin-top:6px; font-size:10.5px; line-height:1.5; padding:6px 8px; border-radius:8px;
    background:#fff; border:2px solid var(--neutral); min-height:44px; display:flex; align-items:center;
    animation:pop 0.35s ease both;
  }
  .npc-bubble.happy{ border-color:var(--happy); background:#f2fbf6; }
  .npc-bubble.sad{ border-color:var(--sad); background:#fdf2f0; }
  .npc-bubble.neutral{ border-color:var(--neutral); }
  @keyframes pop{ from{opacity:0; transform:scale(0.92);} to{opacity:1; transform:scale(1);} }
  .mood-face{ font-size:12px; margin-right:3px; }

  /* ---------- command window ---------- */
  .cmd-story{
    background:var(--panel-blue); border-left:3px solid var(--border-blue);
    padding:10px 12px; border-radius:0 8px 8px 0; font-size:13px; line-height:1.8; margin-bottom:14px;
  }
  .cmd-story b{ color:var(--border-blue-deep); }
  .dial-block{ margin-bottom:14px; }
  .dial-title{
    font-family:var(--pixel-font); font-size:12px; color:var(--border-blue-deep); margin-bottom:6px;
    display:flex; align-items:center; gap:8px;
  }
  .dial-title .tag{ font-size:9px; background:rgba(74,144,217,0.12); border:1px solid rgba(74,144,217,0.4); padding:2px 7px; border-radius:999px; }
  .cmd-list{ display:flex; flex-direction:column; gap:6px; }
  .cmd-row{
    display:flex; align-items:center; gap:10px; background:var(--panel-blue);
    border:2px solid transparent; border-radius:8px; padding:8px 10px; cursor:pointer;
    font-size:12.5px; transition:all 0.12s ease;
  }
  .cmd-row:hover{ background:#e2f0ff; }
  .cmd-row .arrow{ font-family:var(--pixel-font); color:var(--accent-gold-deep); width:14px; opacity:0; }
  .cmd-row.selected{ border-color:var(--accent-gold); background:#fff3d6; }
  .cmd-row.selected .arrow{ opacity:1; }
  .cmd-row .emj{ font-size:18px; }

    var bubbles = {};
    var tally = {};
    order.forEach(function(id){
      bubbles[id] = { mood:"neutral", text: IDLE_GREETING[id] };
      tally[id] = { happy:0, sad:0, neutral:0 };
    });
    return {
      screen: "title",          // title | town | gameover | result
      phase: "mainSelect",      // mainSelect | mainResult | eventIntro | eventChoice | eventResult
      difficulty: difficulty,   // normal | hard
      showSchema: false,
      round: 1,
      temp: 19,
      support: 60,
      history: [19],
      reboundQueued: 0,
      reboundCount: 0,
      netBias: 0,
      coreHits: 0,
      coreStreak: 0,
      keepStreak: 0,
      bankRate: 1.5,
      bankReserve: 300,
      fx: 0,
      lastOp: "none",
      rateChoice: null,
      opChoice: null,
      lastReboundApplied: 0,
      lastStagnation: false,
      lastNarration: "",
      npcBubbles: bubbles,
      charTally: tally,
      eventCard: null,
      eventChoiceKey: null,
      gameoverReason: null,
      fxRequest: null,
      justHitCore: false,
      focusLog: [],
      roundFocusChoice: null,
      roundFocusNote: ""
    };
  }
  function initCharsForDifficulty(){
    var order = charOrder();
    var bubbles = {}; var tally = {};
    order.forEach(function(id){
      bubbles[id] = { mood:"neutral", text: IDLE_GREETING[id] };
      tally[id] = { happy:0, sad:0, neutral:0 };
    });
    state.npcBubbles = bubbles;
    state.charTally = tally;
  }
  state = freshState();

  /* ---------------------------------------------------------

  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function moodFace(m){ return m==="happy" ? "😊" : (m==="sad" ? "😟" : "😐"); }

  function thermoHTML(temp){
    var pct = clamp(temp,0,45)/45*100;
    var z = zoneOf(temp);
    var marks = [17,23,27,33].map(function(m){
      var top = 100 - clamp(m,0,45)/45*100;
      return '<div class="thermo-mark" style="top:'+top+'%"></div>';
    }).join("");
    return '<div class="thermo-outer">'+marks+'<div class="thermo-fill" style="height:'+pct+'%; background:'+z.color+';"></div></div>';
  }

  function supportColor(v){
    if (v <= 25) return "var(--c-hot)";
    if (v <= 50) return "var(--c-warm)";
    return "var(--c-ok)";
  }

  function hudHTML(){
    var pips = "";
    for (var i=1;i<=TOTAL_MAIN_ROUNDS;i++){
      var cls = "pip";
      if (i < state.round) cls += " done";
      else if (i === state.round && state.screen==="town" && state.round<=TOTAL_MAIN_ROUNDS) cls += " now";
      pips += '<span class="'+cls+'"></span>';
    }
    var starCls = "pip star" + (state.round > TOTAL_MAIN_ROUNDS ? " now" : "");
    var z = zoneOf(state.temp);
    var streak = state.coreStreak >= 2 ? '<span class="streak-badge">🔥 適温 x'+state.coreStreak+'</span>' : "";
    return ''+
    '<div class="hud">'+
      '<div class="pips">'+pips+'<span class="'+starCls+'">★</span></div>'+
      '<div class="meter-label">支持率<div class="meter-bar"><div class="meter-fill" style="width:'+state.support+'%; background:'+supportColor(state.support)+';"></div></div>'+state.support+'</div>'+
      streak+
      '<div class="spacer"></div>'+
      '<div class="temp-mini"><span class="dot" style="background:'+z.color+'"></span>'+Math.round(state.temp)+'℃</div>'+
    '</div>';
  }

  function computeInflation(){

    if (infl > 2) return {
      store:    ["happy","値段が上がって、売り上げが伸びているよ！"],
      customer: ["sad","買い物のたびに値段が上がっていて大変…。"]

    if (infl < -2) return {
      store:    ["sad","値段が下がって、売り上げが伸び悩んでいるよ…。"],
      customer: ["happy","安く買えて助かるよ！"]
    };
    return {
      store:    ["neutral","まずまずの売れ行きだよ。"],
      customer: ["neutral","普段通りの買い物ができているよ。"]
    };
  }

      ? "物価がどんどん上がっています。買い物がしづらくなるかも。"
      : (infl < -2 ? "物価が下がり気味です。お店の売り上げが心配…。" : "物価は落ち着いた動きです。");

    return ''+
    '<div class="rpgwin info-box">'+
      '<div class="winhead"><span>📦 物価（インフレ率）</span><span>'+(infl>0?'+':'')+infl.toFixed(1)+'%</span></div>'+

  function computeRank(){
    if (state.reboundCount >= 2 || state.support < 35) return RANKS.jet;
    if (state.reboundCount === 0 && state.coreHits >= 4 && state.support >= 55) return RANKS.S;
    if (state.netBias > 6) return RANKS.accel;
    if (state.netBias < -6) return RANKS.brake;
    return RANKS.balance;
  }

  function downloadReflection(){
    var rank = computeRank();
    var g = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; };
    var t1 = g("refl1") || "（未記入）";
    var t2 = g("refl2") || "（未記入）";
    var t3 = g("refl3") || "（未記入）";
    var lines = [
      "総裁としての振り返りシート",
      "==============================",
      "最終ランク：" + rank.name + "（" + rank.sub + "）",
      "適温クリア：" + state.coreHits + " / " + (TOTAL_MAIN_ROUNDS+1),
      "反動ショック：" + state.reboundCount + " 回",
      "最終支持率：" + state.support + " / 100",
      "温度の推移：" + state.history.map(function(t){return Math.round(t)+"℃";}).join(" → "),
      ""
    ];
    if (state.focusLog && state.focusLog.length > 0){
      lines.push("---- ラウンドごとに寄り添った人たち ----");
      state.focusLog.forEach(function(entry){
        lines.push("R" + entry.round + "：" + entry.name + (entry.note ? "（" + entry.note + "）" : "（メモなし）"));
      });
      var fs = g("focusSummary") || "（未記入）";
      lines.push("");
      lines.push("一番心に残った寄り添いはどれ？なぜ？");
      lines.push(fs);
      lines.push("");
    }
    lines.push("---- ふりかえり ----");
    lines.push("① 今日のプレイで印象に残ったことは？");
    lines.push(t1);
    lines.push("");
    lines.push("② 総裁として工夫した点は？");
    lines.push(t2);
    lines.push("");
    lines.push("③ 次に挑戦するなら、どうしてみたい？");
    lines.push(t3);
    lines.push("");
    var content = lines.join("\n");
    try{
      var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "総裁振り返りシート.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    } catch(e){
      window.alert("ダウンロードできませんでした。お手数ですが、テキストを選択してコピーしてください。");
    }
  }

  /* ---------------------------------------------------------
     BANK / TOWN VISUAL FX (money flow / rate lock / celebration)
  --------------------------------------------------------- */
  function centerPoint(el, hostRect){
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width/2 - hostRect.left, y: r.top + r.height/2 - hostRect.top };
  }

  function spawnCoin(layer, fromPt, toPt, delay, emoji){
    var coin = document.createElement("span");
    coin.className = "fx-coin";
    coin.textContent = emoji;
    coin.style.left = fromPt.x + "px";
    coin.style.top = fromPt.y + "px";
    layer.appendChild(coin);
    window.setTimeout(function(){
      coin.style.transform = "translate("+(toPt.x-fromPt.x)+"px,"+(toPt.y-fromPt.y)+"px) scale(0.6)";
      coin.style.opacity = "0";
    }, 30 + delay);
    window.setTimeout(function(){ if (coin.parentNode) coin.parentNode.removeChild(coin); }, delay + 950);
  }

  function spawnBadge(layer, pt, text, cls){
    var b = document.createElement("div");
    b.className = "fx-badge " + cls;
    b.textContent = text;
    b.style.left = pt.x + "px";
    b.style.top = (pt.y - 46) + "px";
    layer.appendChild(b);
    window.setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 1850);
  }

  function playBankFX(req){
    var host = document.querySelector(".fx-host");
    var fxLayer = document.querySelector(".fx-layer");
    var plazaEl = document.querySelector("[data-plaza]");
    var bankEl = document.querySelector("[data-bankhub]");
    if (!host || !fxLayer || !plazaEl || !bankEl) return;

    var hostRect = host.getBoundingClientRect();
    var plazaPt = centerPoint(plazaEl, hostRect);
    var bankPt = centerPoint(bankEl, hostRect);

    if (req.rate === "up"){
      bankEl.classList.add("pulse-red");
      spawnBadge(fxLayer, bankPt, "🔒 借りづらい…", "badge-red");
    } else if (req.rate === "down"){
      bankEl.classList.add("pulse-green");
      spawnBadge(fxLayer, bankPt, "🔓 借りやすい！", "badge-green");
    }

    if (req.op === "buy"){
      for (var i=0;i<4;i++){ spawnCoin(fxLayer, plazaPt, bankPt, i*140, "💴"); }
    } else if (req.op === "sell"){
      for (var j=0;j<3;j++){ spawnCoin(fxLayer, bankPt, plazaPt, j*150, "💴"); }
    }
  }

  function playCelebration(){
    var host = document.querySelector(".fx-host");
    var fxLayer = document.querySelector(".fx-layer");
    var plazaEl = document.querySelector("[data-plaza]");
    if (!host || !fxLayer || !plazaEl) return;
    var hostRect = host.getBoundingClientRect();
    var pt = centerPoint(plazaEl, hostRect);
    plazaEl.classList.add("pulse-gold");
    var sparks = ["✨","🎉","🌟","✨","🎊","⭐"];
    sparks.forEach(function(sp, idx){
      var angle = (idx / sparks.length) * Math.PI * 2;
      var dist = 46 + Math.random()*18;
      var toPt = { x: pt.x + Math.cos(angle)*dist, y: pt.y + Math.sin(angle)*dist };
      var el = document.createElement("span");
      el.className = "fx-spark";
      el.textContent = sp;
      el.style.left = pt.x + "px";
      el.style.top = pt.y + "px";
      fxLayer.appendChild(el);
      window.setTimeout(function(){
        el.style.transform = "translate("+(toPt.x-pt.x)+"px,"+(toPt.y-pt.y)+"px) scale(1.1)";
        el.style.opacity = "0";
      }, 30 + idx*40);
      window.setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 900);
    });
  }

  /* ---------------------------------------------------------
     MAIN RENDER + WIRE
  --------------------------------------------------------- */
  function render(){
    var app = document.getElementById("app");
    var html = '<div class="brandbar"><div class="line"></div>日本銀行 総裁シミュレーションRPG<div class="line"></div></div>';
    if (state.screen === "title") html += renderTitle();
    else if (state.screen === "town") html += renderTown();
    else if (state.screen === "gameover") html += renderGameover();
    else if (state.screen === "result") html += renderResult();
    html += '<div class="footer-note">小学校 金融教育シミュレーション「日銀マネー・ループ」RPG版</div>';
    app.innerHTML = html;
    wire();
    if (state.fxRequest){
      var req = state.fxRequest;
      state.fxRequest = null;
      playBankFX(req);
    }
    if (state.justHitCore){
      state.justHitCore = false;
      playCelebration();
    }
  }

  function wire(){
    if (state.screen === "title"){
      document.querySelectorAll(".diff-btn").forEach(function(b){
        b.onclick = function(){
          state.difficulty = b.getAttribute("data-diff");
          render();
        };
      });
      document.getElementById("startBtn").onclick = function(){
        initCharsForDifficulty();
        state.screen="town"; state.phase="mainSelect"; render();
      };
      return;
    }
    if (state.screen === "gameover"){
      document.getElementById("retryBtn").onclick = function(){ state = freshState(state.difficulty); render(); };
      return;
    }
    if (state.screen === "result"){
      document.getElementById("restartBtn").onclick = function(){ state = freshState(state.difficulty); render(); };
      var dlBtn = document.getElementById("downloadReflBtn");
      if (dlBtn) dlBtn.onclick = downloadReflection;
      return;
    }
    if (state.screen !== "town") return;

    if (state.phase === "mainSelect"){
      var schemaBtn = document.getElementById("schemaToggleBtn");
      if (schemaBtn) schemaBtn.onclick = function(){ state.showSchema = !state.showSchema; render(); };
      document.querySelectorAll('[data-dial="rate"] .cmd-row').forEach(function(b){
        b.onclick = function(){ state.rateChoice = b.getAttribute("data-key"); render(); };
      });
      document.querySelectorAll('[data-dial="op"] .cmd-row').forEach(function(b){
        b.onclick = function(){ state.opChoice = b.getAttribute("data-key"); render(); };
      });
      var btn = document.getElementById("decideBtn");
      if (btn && !btn.disabled) btn.onclick = resolveRound;
    }
    else if (state.phase === "mainResult"){
      wireFocusPicker();
      var nextBtn = document.getElementById("nextBtn");
      if (nextBtn && !nextBtn.disabled){
        nextBtn.onclick = function(){
          commitFocusPick();
          if (state.round < TOTAL_MAIN_ROUNDS){
            state.round += 1; state.rateChoice = null; state.opChoice = null; state.phase = "mainSelect";
            state.lastStagnation = false;
          } else {
            startEvent();
          }
          render();
        };
      }
    }
    else if (state.phase === "eventIntro"){
      document.getElementById("eventContinueBtn").onclick = function(){ state.phase = "eventChoice"; render(); };
    }
    else if (state.phase === "eventChoice"){
      document.querySelectorAll(".event-choice").forEach(function(b){
        b.onclick = function(){ state.eventChoiceKey = b.getAttribute("data-choice"); resolveEvent(); };
      });
    }
    else if (state.phase === "eventResult"){
      wireFocusPicker();
      var resultBtn = document.getElementById("resultBtn");
      if (resultBtn && !resultBtn.disabled){
        resultBtn.onclick = function(){
          commitFocusPick();
          state.screen = "result";
          render();
        };
      }
    }
  }

  function wireFocusPicker(){
    document.querySelectorAll(".focus-round-block .focus-btn").forEach(function(b){
      b.onclick = function(){
        var noteEl = document.getElementById("focusNoteInput");
        if (noteEl) state.roundFocusNote = noteEl.value;
        state.roundFocusChoice = b.getAttribute("data-focus");
        render();
      };
    });
  }

  function commitFocusPick(){
    var noteEl = document.getElementById("focusNoteInput");
    var note = noteEl ? noteEl.value.trim() : (state.roundFocusNote || "");
    if (state.roundFocusChoice && CHAR_META[state.roundFocusChoice]){
      state.focusLog.push({
        round: state.round,
        id: state.roundFocusChoice,
        name: CHAR_META[state.roundFocusChoice].name,
        em: CHAR_META[state.roundFocusChoice].em,
        note: note
      });
    }
    state.roundFocusChoice = null;
    state.roundFocusNote = "";
  }

  /* ---------------------------------------------------------
     GAME LOGIC
  --------------------------------------------------------- */
  function applySupportAndTally(reactionsMap){
    var happy=0, sad=0;
    Object.keys(reactionsMap).forEach(function(id){
      var m = reactionsMap[id].mood;
      if (state.charTally[id]) state.charTally[id][m] += 1;
      if (m === "happy") happy++;
      else if (m === "sad") sad++;
    });
    var delta = (happy - sad) * 4;
    state.support = clamp(state.support + delta, 0, 100);
  }

  function checkFail(){
    if (state.temp <= 5 || state.temp >= 45){ state.gameoverReason = "temp"; state.screen = "gameover"; return true; }
    if (state.support <= 0){ state.gameoverReason = "support"; state.screen = "gameover"; return true; }
    return false;
  }

  function updateBankStats(rateKey, opKey){
    if (rateKey === "down") state.bankRate = clamp(state.bankRate - 0.4, 0.1, 6);
    else if (rateKey === "up") state.bankRate = clamp(state.bankRate + 0.4, 0.1, 6);
    if (opKey === "buy") state.bankReserve = clamp(state.bankReserve + 150, 0, 600);
    else if (opKey === "sell") state.bankReserve = clamp(state.bankReserve - 150, 0, 600);
    else state.bankReserve = clamp(state.bankReserve - 20, 0, 600);
    state.lastOp = opKey;
  }

  function resolveRound(){
    var reboundApplied = 0;
    if (state.reboundQueued !== 0){
      reboundApplied = state.reboundQueued;
      state.temp += reboundApplied;
      state.reboundQueued = 0;
      state.reboundCount += 1;
    }

    var rateOpt = RATE_OPTIONS.filter(function(o){return o.key===state.rateChoice;})[0];
    var opOpt = OP_OPTIONS.filter(function(o){return o.key===state.opChoice;})[0];
    var delta = rateOpt.val + opOpt.val;

    state.fxRequest = { rate: rateOpt.key, op: opOpt.key };
    updateBankStats(rateOpt.key, opOpt.key);

    // Hard mode: policy rate direction nudges the yen (forex), which feeds back into prices
    var fxDrift = 0;
    if (state.difficulty === "hard"){
      if (rateOpt.key === "up") state.fx = clamp(state.fx + 1, -6, 6);
      else if (rateOpt.key === "down") state.fx = clamp(state.fx - 1, -6, 6);
      if (state.fx <= -4) fxDrift = 1;
      else if (state.fx >= 4) fxDrift = -1;
    }

    // keep-streak tracking: repeated total inaction triggers a stagnation event
    var isKeep = (rateOpt.key === "flat" && opOpt.key === "none");
    state.keepStreak = isKeep ? state.keepStreak + 1 : 0;
    var stagnation = false;
    var stagnationShock = 0;
    if (state.keepStreak >= 2){
      stagnation = true;
      stagnationShock = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random()*2));
      state.support = clamp(state.support - 5, 0, 100);
      state.keepStreak = 0;
    }

    var noise = Math.round((Math.random()*2 - 1)); // -1, 0, or 1
    state.temp = state.temp + delta + noise + stagnationShock + fxDrift;

    state.netBias += delta;
    var zoneHit = (state.temp >= 23 && state.temp <= 27);
    if (zoneHit){ state.coreHits += 1; state.coreStreak += 1; state.justHitCore = true; }
    else state.coreStreak = 0;

    if (Math.abs(delta) >= 7) state.reboundQueued = delta > 0 ? 3 : -3;

    var z = zoneOf(state.temp);
    var reactions = buildReactions(state.rateChoice, z.key, state.fx);
    state.npcBubbles = reactions;
    applySupportAndTally(reactions);

    state.history.push(Math.round(state.temp*10)/10);

    var fxText = fxDrift!==0 ? "（為替の影響でさらに "+(fxDrift>0?"+":"")+fxDrift+"℃ 動きました）" : "";
    var moveText = (delta>=0? "施策により温度が "+delta+"℃ 上がりました。" : "施策により温度が "+Math.abs(delta)+"℃ 下がりました。");
    var noiseText = noise!==0 ? "（街の自然な変動で "+(noise>0?"+":"")+noise+"℃ 動きました）" : "";
    var reboundText = reboundApplied!==0 ? "⚡<b>反動ショック発生！</b>前のラウンドで急に動かしすぎた影響で、街が先に "+(reboundApplied>0?"+":"")+reboundApplied+"℃ 動いてしまいました。その上で、" : "";
    var stagnationText = stagnation ? "😴<b>油断ショック！</b>様子見が続いたことで、街に予想外の変化（"+(stagnationShock>0?"+":"")+stagnationShock+"℃）が起きました。その上で、" : "";
    state.lastReboundApplied = reboundApplied;
    state.lastStagnation = stagnation;
    state.lastNarration = reboundText + stagnationText + moveText + noiseText + fxText + " " + z.text;

    state.rateChoice = null; state.opChoice = null;

    if (checkFail()){ render(); return; }

    state.phase = "mainResult";
    render();
  }

  function startEvent(){
    var pool = state.difficulty === "hard" ? EVENT_CARDS_HARD : EVENT_CARDS_NORMAL;
    var card = pool[Math.floor(Math.random()*pool.length)];
    state.eventCard = card;
    state.round = TOTAL_MAIN_ROUNDS + 1;
    state.temp = card.shockTemp;
    if (state.difficulty === "hard" && card.fxShock){
      state.fx = clamp(state.fx + card.fxShock, -6, 6);
    }
    state.history.push(state.temp);
    state.support = clamp(state.support - 4, 0, 100);
    state.phase = "eventIntro";
    if (checkFail()) { render(); return; }
    render();
  }

  function resolveEvent(){
    var card = state.eventCard;
    var choice = card.choices[state.eventChoiceKey];
    state.fxRequest = { rate: choice.policyRate || "flat", op: choice.policyOp || "none" };
    updateBankStats(choice.policyRate || "flat", choice.policyOp || "none");
    if (state.difficulty === "hard" && choice.fxShift){
      state.fx = clamp(state.fx + choice.fxShift, -6, 6);
    }
    state.temp = choice.resultTemp;
    var zoneHit = (state.temp >= 23 && state.temp <= 27);
    if (zoneHit){ state.coreHits += 1; state.justHitCore = true; }
    state.history.push(state.temp);

    var reactions = {};
    Object.keys(choice.reactions).forEach(function(id){
      reactions[id] = { mood: choice.reactions[id][0], text: choice.reactions[id][1] };
    });
    charOrder().forEach(function(id){ if (!reactions[id]) reactions[id] = { mood:"neutral", text:"街の様子を見守っています。" }; });
    state.npcBubbles = reactions;
    applySupportAndTally(reactions);

    if (checkFail()){ render(); return; }

    state.phase = "eventResult";
    render();
  }

  render();
})();

</script>
